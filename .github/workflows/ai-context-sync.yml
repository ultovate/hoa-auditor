name: AI Context Sync

on:
  push:
    branches: [main, master, dev]

jobs:
  sync-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write LAST_SYNC.md
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -10 || echo "Initial commit")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_HASH=$(git log -1 --pretty=%h)
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          FILES_LIST=$(echo "$CHANGED_FILES" | sed 's/^/  - /')
          printf '# Last GitHub Sync\n- **Timestamp:** %s\n- **Commit:** `%s` — %s\n- **Files changed:**\n%s\n' \
            "$TIMESTAMP" "$COMMIT_HASH" "$COMMIT_MSG" "$FILES_LIST" > LAST_SYNC.md

      - name: Commit LAST_SYNC.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LAST_SYNC.md
          git diff --staged --quiet || git commit -m "chore: auto-sync AI context [skip ci]"
          git push
