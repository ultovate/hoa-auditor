<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultovate — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0F1E2E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* Background glow effects */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(46,91,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(16,185,129,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 2.5rem;
      letter-spacing: -.01em;
    }
    .logo span { color: #4A73FF; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(46,91,255,0.12);
      border: 1px solid rgba(46,91,255,0.3);
      color: #7B9FFF;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .35rem .85rem;
      border-radius: 999px;
      margin-bottom: 1.75rem;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: #4A73FF;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.8); }
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      color: #fff;
      line-height: 1.15;
      margin-bottom: 1.25rem;
      letter-spacing: -.02em;
    }
    h1 em {
      font-style: italic;
      color: #4A73FF;
    }

    .subtitle {
      color: #6B7F99;
      font-size: 1.05rem;
      line-height: 1.65;
      margin-bottom: 2.5rem;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .notify-form {
      display: flex;
      gap: .6rem;
      max-width: 400px;
      margin: 0 auto 1rem;
    }
    .notify-form input {
      flex: 1;
      padding: .75rem 1.1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      outline: none;
      transition: border .2s;
    }
    .notify-form input::placeholder { color: #4B5E73; }
    .notify-form input:focus { border-color: rgba(46,91,255,0.5); }
    .notify-form button {
      padding: .75rem 1.25rem;
      background: #2E5BFF;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }
    .notify-form button:hover { background: #4A73FF; }

    .success-msg {
      color: #10B981;
      font-size: .85rem;
      min-height: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 2rem auto;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: .5rem;
      color: #4B5E73;
      font-size: .82rem;
    }
    .feature .icon {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0; right: 0;
      text-align: center;
      color: #2A3D52;
      font-size: .78rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">Ulto<span>vate</span></div>

  <div class="badge">Coming Soon</div>

  <h1>AI-powered tools for<br><em>smarter</em> real estate</h1>

  <p class="subtitle">
    We're building intelligent document analysis tools for real estate professionals. Be the first to know when we launch.
  </p>

  <div class="notify-form">
    <input type="email" id="email-input" placeholder="Enter your email" />
    <button onclick="handleNotify()">Notify Me</button>
  </div>
  <div class="success-msg" id="success-msg"></div>

  <div class="divider"></div>

  <div class="features">
    <div class="feature"><div class="icon">📄</div> HOA Document Analysis</div>
    <div class="feature"><div class="icon">⚡</div> Instant Risk Scoring</div>
    <div class="feature"><div class="icon">🏢</div> Built for Agents</div>
  </div>
</div>

<div class="footer">© 2026 Ultovate · ultovate.com</div>

<script>
  function handleNotify() {
    const email = document.getElementById('email-input').value.trim()
    const msg = document.getElementById('success-msg')
    if (!email || !email.includes('@')) {
      msg.style.color = '#EF4444'
      msg.textContent = 'Please enter a valid email address.'
      return
    }
    msg.style.color = '#10B981'
    msg.textContent = "✓ You're on the list — we'll be in touch soon."
    document.getElementById('email-input').value = ''
  }

  document.getElementById('email-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleNotify()
  })
</script>
</body>
</html>
