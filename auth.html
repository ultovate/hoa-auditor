<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOA Auditor — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0F1E2E;
      --blue: #2E5BFF;
      --blue-light: #4A73FF;
      --gray-400: #9CA3AF;
      --gray-600: #4B5563;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      background-image: radial-gradient(ellipse 80% 60% at 60% 10%, #1e3a5f 0%, transparent 70%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { max-width: 420px; width: 100%; padding: 2rem; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--white); margin-bottom: .25rem; }
    .logo span { color: var(--blue-light); }
    .tagline { color: var(--gray-400); font-size: .85rem; margin-bottom: 2.5rem; }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2rem;
      backdrop-filter: blur(12px);
    }
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,.1); }
    .tab {
      flex: 1; padding: .6rem; text-align: center; color: var(--gray-400);
      font-size: .9rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .tab.active { color: var(--white); border-bottom-color: var(--blue-light); }
    .form { display: none; }
    .form.active { display: block; }
    label {
      display: block; color: var(--gray-400); font-size: .78rem;
      font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
      margin-bottom: .4rem; margin-top: 1rem;
    }
    input {
      width: 100%; padding: .7rem 1rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: .95rem;
      outline: none; transition: border .2s;
    }
    input:focus { border-color: var(--blue-light); }
    .btn {
      width: 100%; padding: .8rem; margin-top: 1.5rem;
      background: var(--blue); color: var(--white);
      border: none; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: .95rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: var(--blue-light); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error {
      background: #FEF2F2; color: #B91C1C;
      border-radius: 8px; padding: .75rem 1rem;
      font-size: .85rem; margin-top: 1rem;
      display: none;
    }
    .success {
      background: #ECFDF5; color: #065F46;
      border-radius: 8px; padding: .75rem 1rem;
      font-size: .85rem; margin-top: 1rem;
      display: none;
    }
    .forgot { 
      text-align: right; margin-top: .5rem;
      font-size: .8rem; color: var(--blue-light);
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">HOA<span>Auditor</span></div>
  <div class="tagline">AI-powered HOA document analysis</div>

  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('signin')">Sign In</div>
      <div class="tab" onclick="switchTab('signup')">Create Account</div>
    </div>

    <!-- Sign In Form -->
    <div id="form-signin" class="form active">
      <label>Email Address</label>
      <input type="email" id="signin-email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="signin-password" placeholder="••••••••" />
      <div class="forgot" onclick="switchTab('forgot')">Forgot password?</div>
      <button class="btn" onclick="handleSignIn()">Sign In</button>
      <div class="error" id="signin-error"></div>
    </div>

    <!-- Sign Up Form -->
    <div id="form-signup" class="form">
      <label>Email Address</label>
      <input type="email" id="signup-email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="signup-password" placeholder="At least 8 characters" />
      <button class="btn" onclick="handleSignUp()">Create Account</button>
      <div class="error" id="signup-error"></div>
      <div class="success" id="signup-success"></div>
    </div>

    <!-- Forgot Password Form -->
    <div id="form-forgot" class="form">
      <label>Email Address</label>
      <input type="email" id="forgot-email" placeholder="you@example.com" />
      <button class="btn" onclick="handleForgotPassword()">Send Reset Link</button>
      <div class="error" id="forgot-error"></div>
      <div class="success" id="forgot-success"></div>
    </div>
  </div>
</div>

<script type="module">
  import { signIn, signUp } from './src/services/authService.js'
  import { supabase } from './src/services/supabase.js'

  // Tab switching
  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'))
    document.querySelectorAll('.tab')[['signin','signup','forgot'].indexOf(tab)].classList.add('active')
    document.getElementById('form-' + tab).classList.add('active')
  }

  // Sign In
  window.handleSignIn = async function() {
    const email = document.getElementById('signin-email').value
    const password = document.getElementById('signin-password').value
    const errorEl = document.getElementById('signin-error')
    const btn = document.querySelector('#form-signin .btn')

    btn.disabled = true
    btn.textContent = 'Signing in...'
    errorEl.style.display = 'none'

    try {
      await signIn(email, password)
      window.location.href = '/dashboard.html'
    } catch (err) {
      errorEl.textContent = err.message
      errorEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Sign In'
    }
  }

  // Sign Up
  window.handleSignUp = async function() {
    const email = document.getElementById('signup-email').value
    const password = document.getElementById('signup-password').value
    const errorEl = document.getElementById('signup-error')
    const successEl = document.getElementById('signup-success')
    const btn = document.querySelector('#form-signup .btn')

    btn.disabled = true
    btn.textContent = 'Creating account...'
    errorEl.style.display = 'none'

    try {
      await signUp(email, password)
      successEl.textContent = '✅ Account created! Check your email to confirm your account.'
      successEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Create Account'
    } catch (err) {
      errorEl.textContent = err.message
      errorEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Create Account'
    }
  }

  // Forgot Password
  window.handleForgotPassword = async function() {
    const email = document.getElementById('forgot-email').value
    const errorEl = document.getElementById('forgot-error')
    const successEl = document.getElementById('forgot-success')
    const btn = document.querySelector('#form-forgot .btn')

    btn.disabled = true
    btn.textContent = 'Sending...'

    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/dashboard.html`
      })
      if (error) throw error
      successEl.textContent = '✅ Password reset link sent! Check your email.'
      successEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Send Reset Link'
    } catch (err) {
      errorEl.textContent = err.message
      errorEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Send Reset Link'
    }
  }

  // If already logged in, redirect to dashboard
  import { getCurrentUser } from './src/services/authService.js'
  getCurrentUser().then(user => {
    if (user) window.location.href = '/dashboard.html'
  })
</script>
</body>
</html>
