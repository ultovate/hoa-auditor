<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOA Auditor — Summary</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0F1E2E;
      --blue: #2E5BFF;
      --blue-light: #4A73FF;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--gray-100); min-height: 100vh; }

    /* Topbar */
    .topbar {
      background: var(--navy); padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-family: 'DM Serif Display', serif; color: var(--white); font-size: 1.3rem; }
    .brand span { color: var(--blue-light); }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    .user-email { color: var(--gray-400); font-size: .85rem; }
    .btn-signout {
      padding: .4rem .9rem; background: transparent;
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
      color: rgba(255,255,255,.6); font-family: 'DM Sans', sans-serif;
      font-size: .82rem; cursor: pointer; transition: all .2s;
    }
    .btn-signout:hover { border-color: rgba(255,255,255,.5); color: var(--white); }

    /* Nav row */
    .btn-primary {
      padding: .6rem 1.25rem; background: var(--blue); color: var(--white);
      border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif;
      font-size: .9rem; font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-primary:hover { background: var(--blue-light); }

    .back-btn {
      display: flex; align-items: center; gap: .4rem; color: var(--gray-600);
      font-size: .88rem; cursor: pointer; background: none; border: none;
      font-family: 'DM Sans', sans-serif; padding: 0;
    }
    .back-btn:hover { color: var(--blue); }

    /* Loading / error states */
    .state-card {
      background: var(--white); border-radius: 12px; border: 1px solid var(--gray-200);
      padding: 3rem; text-align: center; color: var(--gray-400); font-size: .9rem;
    }

    @media (max-width: 600px) {
      .topbar { padding: .75rem 1rem; }
      .user-email { display: none; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">HOA<span>Auditor</span></div>
  <div class="user-info">
    <span class="user-email" id="user-email"></span>
    <button class="btn-signout" onclick="handleSignOut()">Sign out</button>
  </div>
</div>

<div class="summary-page">

  <div class="summary-nav">
    <button class="back-btn" onclick="history.back()">← Back to Properties</button>
    <button class="btn-primary" onclick="goToFullReport()">View Full Report →</button>
  </div>

  <div class="summary-eyebrow">Executive Summary</div>
  <div class="summary-property-label" id="summary-property-label">Loading...</div>

  <div id="summary-content">
    <div class="state-card">Loading analysis...</div>
  </div>

</div>

<script type="module">
  import { getCurrentUser, signOut } from './src/services/authService.js'
  import { renderExecutiveSummary } from './src/views/summaryView.js'

  // ── AUTH ─────────────────────────────────────────────
  const user = await getCurrentUser()
  if (!user) {
    window.location.href = import.meta.env.BASE_URL + 'auth.html'
  }

  const role = user.user_metadata?.role || 'buyer'
  document.getElementById('user-email').textContent = user.email

  window.handleSignOut = async function() {
    await signOut()
    window.location.href = import.meta.env.BASE_URL + 'auth.html'
  }

  // ── LOAD AUDIT ───────────────────────────────────────
  const params  = new URLSearchParams(window.location.search)
  const auditId = params.get('auditId')

  if (!auditId) {
    window.location.href = import.meta.env.BASE_URL + 'dashboard.html'
  }

  window.goToFullReport = function() {
    window.location.href = import.meta.env.BASE_URL + 'report.html?auditId=' + auditId
  }

  const { supabase } = await import('./src/services/supabase.js')
  const { data: audit } = await supabase
    .from('audits')
    .select('*')
    .eq('audit_id', auditId)
    .single()

  if (!audit?.analysis) {
    document.getElementById('summary-property-label').textContent = ''
    document.getElementById('summary-content').innerHTML =
      '<div class="state-card">No analysis available for this property.</div>'
  } else {
    const a       = audit.analysis
    const hoaName = a.metadata?.hoa_name || ''
    const addr    = a.metadata?.property_address || audit.property_name || ''

    document.getElementById('summary-property-label').textContent =
      [hoaName, addr].filter(Boolean).join(' · ')

    document.title = `HOA Auditor — ${audit.property_name || 'Summary'}`

    renderExecutiveSummary(a, role)
  }
</script>

</body>
</html>
