<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOA Auditor — Full Report</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F2F3F6; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── PERSISTENT HEADER — full width, all roles, never re-renders ─ */
    #header-mount { flex-shrink: 0; }

    /* ── PAGE SHELL — flex row below header ──────────────────────── */
    /* #nav-mount: 56px agent only, hidden (display:none) for buyer  */
    /* #main-col:  flex:1, fills full width when nav is absent       */
    #page-shell { display: flex; flex: 1; }
    #nav-mount  { width: 56px; flex-shrink: 0; }
    #main-col   { flex: 1; overflow-x: hidden; overflow-y: auto; }

    /* ── AGENT VIEW — content only, no flex needed here ─────────── */
    #agent-view { display: block; }

    /* ── BUYER VIEW ───────────────────────────────────────────── */
    #buyer-view { display: none; position: relative; padding-bottom: 56px; }

    /* ── HERO (buyer.css classes — do not modify) ─────────────── */
    /* property-hero, property-hero-header, property-hero-text,    */
    /* ph-eyebrow, ph-address, ph-meta, property-hero-image        */
    /* These classes are owned by src/styles/buyer.css             */
    .property-hero { border-radius: 0; border: none; margin-bottom: 0; }

    /* ── CONTENT BODY ─────────────────────────────────────────── */
    .report-body { padding: 16px; }

    /* ── STATE CARD (loading / error) ────────────────────────── */
    .state-card {
      background: #FFFFFF; border-radius: 12px; border: 1px solid #E5E7EB;
      padding: 3rem; text-align: center; color: #9CA3AF; font-size: .9rem;
      margin: 16px;
    }

    /* ── AI ASSISTANT BUBBLE ──────────────────────────────────── */
    #ai-bubble {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 900;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #1D4ED8, #7C3AED);
      border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(29,78,216,.4);
      display: flex; align-items: center; justify-content: center;
      transition: transform .2s, box-shadow .2s;
    }
    #ai-bubble:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(29,78,216,.5); }
    #ai-bubble svg { width: 24px; height: 24px; }

    #ai-panel {
      position: fixed; bottom: 5.5rem; right: 1.5rem; z-index: 900;
      width: min(380px, calc(100vw - 2rem));
      background: #fff; border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(12px) scale(.97); opacity: 0;
      pointer-events: none;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
    }
    #ai-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }

    .ai-panel-header {
      background: linear-gradient(135deg, #1D4ED8, #7C3AED);
      padding: .9rem 1.1rem; display: flex; align-items: center; gap: .6rem;
    }
    .ai-panel-header .ai-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0;
    }
    .ai-panel-header-text { flex: 1; }
    .ai-panel-header-text strong { color: #fff; font-size: .9rem; display: block; }
    .ai-panel-header-text span { color: rgba(255,255,255,.7); font-size: .74rem; }
    .ai-panel-close { background: none; border: none; color: rgba(255,255,255,.7); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 0; }
    .ai-panel-close:hover { color: #fff; }

    .ai-messages {
      flex: 1; overflow-y: auto; padding: .9rem 1rem;
      display: flex; flex-direction: column; gap: .6rem;
      max-height: 260px; min-height: 120px;
    }
    .ai-msg { display: flex; gap: .5rem; align-items: flex-end; }
    .ai-msg.user { flex-direction: row-reverse; }
    .ai-msg-bubble {
      max-width: 80%; padding: .55rem .8rem; border-radius: 12px;
      font-size: .82rem; line-height: 1.5; color: #1F2937; background: #F3F4F6;
    }
    .ai-msg.user .ai-msg-bubble { background: #1D4ED8; color: #fff; border-radius: 12px 12px 2px 12px; }
    .ai-msg.bot  .ai-msg-bubble { border-radius: 12px 12px 12px 2px; }
    .ai-typing span {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #9CA3AF; margin: 0 1px; animation: ai-bounce .9s infinite;
    }
    .ai-typing span:nth-child(2) { animation-delay: .15s; }
    .ai-typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes ai-bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    .ai-chips {
      padding: .5rem 1rem .6rem; display: flex; flex-wrap: wrap; gap: .4rem;
      border-top: 1px solid #F3F4F6;
    }
    .ai-chip {
      padding: .3rem .7rem; border-radius: 20px; border: 1px solid #BFDBFE;
      background: #EFF6FF; color: #1D4ED8; font-size: .75rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 500; white-space: nowrap;
      transition: background .15s;
    }
    .ai-chip:hover { background: #DBEAFE; }

    .ai-input-row {
      padding: .7rem 1rem; border-top: 1px solid #E5E7EB;
      display: flex; gap: .5rem; align-items: center;
    }
    .ai-input-row input {
      flex: 1; border: 1px solid #E5E7EB; border-radius: 8px;
      padding: .45rem .75rem; font-size: .82rem; font-family: 'DM Sans', sans-serif;
      outline: none; color: #1F2937;
    }
    .ai-input-row input:focus { border-color: #93C5FD; }
    .ai-input-row button {
      width: 34px; height: 34px; border-radius: 8px; border: none;
      background: #1D4ED8; color: #fff; cursor: pointer; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      transition: background .15s;
    }
    .ai-input-row button:hover { background: #1e40af; }

    .ai-coming-soon-note {
      text-align: center; font-size: .72rem; color: #9CA3AF;
      padding: 0 1rem .6rem; font-style: italic;
    }
  </style>
</head>
<body>

<!-- ── PERSISTENT HEADER — all roles, mounts once on load ──────────── -->
<div id="header-mount"></div>

<!-- ── PAGE SHELL — side nav | main content ────────────────────────── -->
<div id="page-shell">

  <!-- Side nav — persistent for agents, empty for buyers -->
  <div id="nav-mount"></div>

  <!-- Main content column — banner first, then views -->
  <div id="main-col">

    <!-- Property banner — persistent, all roles, factual metadata only -->
    <div id="banner-mount"></div>

    <!-- Category tabs — sticky, all roles -->
    <div id="tabs-mount"></div>

    <!-- Tab content area — re-renders on tab switch -->
    <div id="content-mount"></div>

    <!-- Role toggle — always at top of content column -->
    <div id="role-toggle-mount"></div>

    <!-- ── AGENT VIEW ──────────────────────────────────────────── -->
    <div id="agent-view">
      <div id="agent-action-header"></div>
      <div id="agent-hero-mount"></div>
      <div id="agent-findings-mount"></div>
    </div>

    <!-- ── BUYER VIEW — hidden until role toggle → Buyer ───────── -->
    <div id="buyer-view">
      <div id="buyer-topbar-mount"></div>
      <div id="buyer-hero-mount"></div>
      <div id="buyer-save-strip-mount"></div>
      <div id="buyer-findings-mount"></div>
      <div id="buyer-cta-mount"></div>
    </div>

  </div><!-- /main-col -->
</div><!-- /page-shell -->

<!-- ── AI ASSISTANT BUBBLE — unchanged ──────────────────────────────── -->
<button id="ai-bubble" title="Ask about this HOA" aria-label="AI Assistant">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <circle cx="9" cy="10" r=".5" fill="#fff" stroke="none"/>
    <circle cx="12" cy="10" r=".5" fill="#fff" stroke="none"/>
    <circle cx="15" cy="10" r=".5" fill="#fff" stroke="none"/>
  </svg>
</button>

<div id="ai-panel">
  <div class="ai-panel-header">
    <div class="ai-avatar">✨</div>
    <div class="ai-panel-header-text">
      <strong>HOA Assistant</strong>
      <span>Ask anything about this report</span>
    </div>
    <button class="ai-panel-close" id="ai-panel-close">×</button>
  </div>
  <div class="ai-messages" id="ai-messages">
    <div class="ai-msg bot">
      <div class="ai-msg-bubble">Hi! I can help you understand this HOA report or draft a message. What would you like to know?</div>
    </div>
  </div>
  <div class="ai-chips" id="ai-chips">
    <button class="ai-chip">Are rentals allowed?</button>
    <button class="ai-chip">Pet restrictions?</button>
    <button class="ai-chip">Any special assessments?</button>
    <button class="ai-chip">Is this HOA financially healthy?</button>
    <button class="ai-chip">Draft a message about a concern</button>
  </div>
  <div class="ai-input-row">
    <input type="text" id="ai-input" placeholder="Ask anything..." />
    <button id="ai-send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="ai-coming-soon-note">✦ AI responses coming soon</div>
</div>

<!-- ── AI BUBBLE SCRIPT — unchanged ─────────────────────────────────── -->
<script>
  const bubble   = document.getElementById('ai-bubble')
  const panel    = document.getElementById('ai-panel')
  const closeBtn = document.getElementById('ai-panel-close')
  const input    = document.getElementById('ai-input')
  const sendBtn  = document.getElementById('ai-send')
  const messages = document.getElementById('ai-messages')

  bubble.addEventListener('click', () => panel.classList.toggle('open'))
  closeBtn.addEventListener('click', () => panel.classList.remove('open'))

  document.getElementById('ai-chips').addEventListener('click', e => {
    const chip = e.target.closest('.ai-chip')
    if (chip) sendMessage(chip.textContent)
  })

  sendBtn.addEventListener('click', () => { if (input.value.trim()) sendMessage(input.value.trim()) })
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && input.value.trim()) sendMessage(input.value.trim()) })

  function addMsg(text, type) {
    const div = document.createElement('div')
    div.className = `ai-msg ${type}`
    div.innerHTML = `<div class="ai-msg-bubble">${text}</div>`
    messages.appendChild(div)
    messages.scrollTop = messages.scrollHeight
    return div
  }

  function sendMessage(text) {
    input.value = ''
    addMsg(text, 'user')
    const typing = document.createElement('div')
    typing.className = 'ai-msg bot'
    typing.innerHTML = `<div class="ai-msg-bubble ai-typing"><span></span><span></span><span></span></div>`
    messages.appendChild(typing)
    messages.scrollTop = messages.scrollHeight
    setTimeout(() => {
      typing.remove()
      addMsg('This feature is coming soon — AI-powered answers based on your HOA documents. Stay tuned! ✨', 'bot')
    }, 1200)
  }
</script>

<!-- ── MODULE SCRIPT — components + data ────────────────────────────── -->
<script type="module">
  import './src/styles/buyer.css'
  import { renderPropertyBanner, renderCategoryTabs, renderRoleToggle, renderFindingCard, renderAccordionRow, renderBadge } from './src/components/shared.js'
  import { renderPersistentHeader, renderSideNav, renderExportButton, renderComplianceCounter } from './src/components/agentShell.js'
  import { renderTopBar, renderStickyCTA, renderSaveToAccountStrip } from './src/components/buyerShell.js'
  import { getCurrentUser, signOut } from './src/services/authService.js'
  import { supabase } from './src/services/supabase.js'

  // ── INIT (async IIFE — avoids illegal top-level return) ────────────
  ;(async () => {

  // ── AUTH ────────────────────────────────────────────────────────────
  const user          = await getCurrentUser()
  const authenticated = !!user

  // Shared-link buyers (no account) land here without a session.
  // Agents always require auth — redirect if no user and not a shared link.
  const params  = new URLSearchParams(window.location.search)
  const auditId = params.get('auditId')
  const urlRole = params.get('role') || 'agent'

  const isSharedLink = !authenticated && urlRole === 'buyer'

  if (!authenticated && !isSharedLink) {
    window.location.href = import.meta.env.BASE_URL + 'auth.html'
    return
  }

  if (!auditId) {
    window.location.href = import.meta.env.BASE_URL + 'dashboard.html'
    return
  }

  window.handleSignOut = async () => {
    await signOut()
    window.location.href = import.meta.env.BASE_URL + 'auth.html'
  }

  // ── LOAD AUDIT ──────────────────────────────────────────────────────
  const { data: audit } = await supabase
    .from('audits')
    .select('*')
    .eq('audit_id', auditId)
    .single()

  if (!audit?.analysis) {
    document.getElementById('agent-findings-mount').innerHTML =
      '<div class="state-card">No analysis available for this property.</div>'
    document.getElementById('buyer-findings-mount').innerHTML =
      '<div class="state-card">No analysis available for this property.</div>'
    mountRoleToggle()
    swapViews()
    return
  }

  const a          = audit.analysis
  const findings   = a.risks?.findings || []
  const compliance = a.compliance_check || {}
  const addr       = a.metadata?.property_address || audit.property_name || ''
  const hoaName    = a.metadata?.hoa_name || ''

  document.title = `HOA Auditor — ${addr || 'Full Report'}`

  // ── ROLE STATE ──────────────────────────────────────────────────────
  // Agent tab is active by default regardless of user role —
  // renderRoleToggle is a view switcher, not an auth gate.
  let activeRole = 'agent'

  // ── HELPERS ─────────────────────────────────────────────────────────

  function buildHero() {
    // Uses existing buyer.css classes — do not add inline font/color overrides.
    return `<div class="property-hero">
  <div class="property-hero-header">
    <div class="property-hero-text">
      <div class="ph-eyebrow">${hoaName}</div>
      <div class="ph-address">${addr}</div>
      <div class="ph-meta">Full Report</div>
    </div>
    <div class="property-hero-image"></div>
  </div>
</div>`
  }

  function buildFindings(noteField) {
    // noteField: 'agent_note' for agent view, 'buyer_note' for buyer view.
    // Falls back to finding text if the role-specific note is absent.
    if (!findings.length) {
      return '<p style="font-size:14px;color:#6B5A6D;padding:16px 0;">No findings recorded for this property.</p>'
    }
    return findings.map(f => renderFindingCard({
      severity: f.urgency   || 'LOW',
      eyebrow:  f.category  || 'Finding',
      title:    f.label     || f.finding || '',
      detail:   f[noteField] || f.finding || '',
      source:   [f.source_document, f.source_section].filter(Boolean).join(' ') || 'Document on file',
    })).join('')
  }

  // ── ROLE TOGGLE ─────────────────────────────────────────────────────
  function mountRoleToggle() {
    const el = document.getElementById('role-toggle-mount')
    el.innerHTML = renderRoleToggle(activeRole)

    // Attach click handlers to the two role spans rendered by renderRoleToggle.
    // renderRoleToggle renders exactly two <span> elements: Agent and Buyer.
    el.querySelectorAll('span').forEach(span => {
      span.addEventListener('click', () => {
        const clicked = span.textContent.trim().toLowerCase()
        if (clicked !== activeRole) {
          activeRole = clicked
          mountRoleToggle()   // re-render toggle with new active state
          swapViews()
        }
      })
    })
  }

  function swapViews() {
    // Side nav (#nav-mount) is never touched here — it persists across role switches
    document.getElementById('agent-view').style.display = activeRole === 'agent' ? 'block' : 'none'
    document.getElementById('buyer-view').style.display = activeRole === 'buyer'  ? 'block' : 'none'
  }

  // ── AGENT VIEW ──────────────────────────────────────────────────────
  function mountAgentView() {
    // Side nav — injected once into the persistent #nav-mount outside the toggle
    document.getElementById('nav-mount').innerHTML =
      renderSideNav({ expanded: false, activeItem: 'dashboard' })

    // Action header: back link | compliance counter | export button
    const pill = renderComplianceCounter('WUCIOA', compliance.verified ?? 0, compliance.total ?? 26)
    const pillBg    = pill.type === 'ok' ? '#DCFCE7' : '#FEF3C7'
    const pillColor = pill.type === 'ok' ? '#15803D' : '#92400E'

    document.getElementById('agent-action-header').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(43,25,46,0.1);background:#FFFFFF;">
        <div style="display:flex;align-items:center;gap:8px;">
          <button onclick="history.back()" style="background:none;border:none;font-size:13px;color:#6B5A6D;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;">← Back</button>
          <span style="color:#E5E7EB;">|</span>
          <span style="font-size:12px;color:#6B5A6D;">WUCIOA</span>
          <span style="background:${pillBg};color:${pillColor};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;">${pill.text}</span>
        </div>
        ${renderExportButton()}
      </div>`

    // Property hero
    document.getElementById('agent-hero-mount').innerHTML = buildHero()

    // Findings — agent_note field carries professional language + citations
    document.getElementById('agent-findings-mount').innerHTML =
      `<div class="report-body">${buildFindings('agent_note')}</div>`
  }

  // ── BUYER VIEW ──────────────────────────────────────────────────────
  function mountBuyerView() {
    // Top bar — authenticated buyers get account dropdown, shared-link buyers do not
    document.getElementById('buyer-topbar-mount').innerHTML =
      renderTopBar({ authenticated })

    // Property hero — same markup, same classes, different mount point
    document.getElementById('buyer-hero-mount').innerHTML = buildHero()

    // Save-to-account strip — amber nudge, unauthenticated buyers only
    document.getElementById('buyer-save-strip-mount').innerHTML =
      authenticated ? '' : renderSaveToAccountStrip()

    // Findings — buyer_note field carries plain-English copy
    document.getElementById('buyer-findings-mount').innerHTML =
      `<div class="report-body">${buildFindings('buyer_note')}</div>`

    // Sticky CTA — copy differs by entry path
    const ctaLabel = authenticated
      ? 'Talk to a real estate professional →'
      : 'Ask your agent about these →'
    document.getElementById('buyer-cta-mount').innerHTML = renderStickyCTA(ctaLabel)
  }

  // ── SHELL INIT ───────────────────────────────────────────────────────
  // Phase 1: persistent shell — header + side nav.
  // Phase 2: property banner — first element in #main-col.
  // Tabs and findings deferred until banner is verified.

  // 1. Persistent header — all roles, never re-renders
  document.getElementById('header-mount').innerHTML = renderPersistentHeader()

  // 2. Side nav — agent only; buyer gets display:none so #main-col fills full width
  if (urlRole === 'agent') {
    document.getElementById('nav-mount').innerHTML =
      renderSideNav({ expanded: false, activeItem: 'dashboard' })
  } else {
    document.getElementById('nav-mount').style.display = 'none'
  }

  // 3. Property banner — hardcoded test data, factual metadata only, no verdict
  document.getElementById('banner-mount').innerHTML = renderPropertyBanner(
    {
      hoaName:       'Chiavari Owners Association',
      address:       '10398 NE 17th St., #302, Bellevue WA 98004',
      submittedDate: 'April 8, 2026',
      docCount:      '6 documents',
      wucioa:        { verified: 0, total: 26 },
    },
    urlRole
  )

  // 4. Category tabs + content
  let activeTab = 'risks'
  const tabsMount   = document.getElementById('tabs-mount')
  const contentMount = document.getElementById('content-mount')

  // noteField — agent sees professional language, buyer sees plain-English copy
  const noteField = urlRole === 'buyer' ? 'buyer_note' : 'agent_note'

  // Sort order for risk findings: CRITICAL + HIGH first, then MEDIUM, then LOW
  const SORT_ORDER = { CRITICAL: 0, HIGH: 0, MEDIUM: 1, LOW: 2 }

  function findingCards(items) {
    return items.map(f => renderFindingCard({
      severity: f.urgency    || 'LOW',
      eyebrow:  f.category   || 'Finding',
      title:    f.label      || f.finding || '',
      detail:   f[noteField] || f.finding || '',
      source:   [f.source_document, f.source_section].filter(Boolean).join(' · ') || 'Document on file',
    })).join('')
  }

  function gridWrap(cardsHtml, count) {
    const style = count >= 5 ? 'display:grid;grid-template-columns:1fr 1fr;gap:16px;' : ''
    return `<div style="${style}">${cardsHtml}</div>`
  }

  function renderRisksContent() {
    const all    = a.risks?.findings || []
    const high   = all.filter(f => f.urgency === 'CRITICAL' || f.urgency === 'HIGH')
    const medium = all.filter(f => f.urgency === 'MEDIUM')
    const low    = all.filter(f => f.urgency === 'LOW')

    if (!all.length) {
      return `<div style="background:#FFFFFF;border-radius:8px;border:1px solid rgba(43,25,46,0.08);padding:20px 24px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B5A6D;margin:0 0 8px;">No risks identified</p>
        <p style="font-size:14px;font-weight:400;color:#2B192E;line-height:1.6;margin:0;">No significant risks were found in the uploaded documents.</p>
      </div>`
    }

    // Inline accordion builder — exact spec: bg #FFFFFF, border rgba(43,25,46,0.08),
    // border-radius 8px, header padding 14px 20px. DOM structure matches toggle handler:
    // wrapper (2 children, border-radius:8px) → children[0] header (cursor:pointer)
    //                                         → children[1] body  (display:none)
    function riskAccordion({ label, count, pillColor, pillBorder, bodyHtml }) {
      const chevron = `<div style="width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid rgba(43,25,46,0.25);flex-shrink:0;"></div>`
      const pill    = `<span style="color:${pillColor};background:transparent;border:1px solid ${pillBorder};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0;">${count}</span>`
      return `<div data-risk-acc="1" style="background:#FFFFFF;border:1px solid rgba(43,25,46,0.08);border-radius:8px;overflow:hidden;margin-bottom:8px;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;">
    <p style="font-size:13px;font-weight:600;color:#2B192E;margin:0;">${label}</p>
    <div style="display:flex;align-items:center;gap:8px;">${pill}${chevron}</div>
  </div>
  <div style="display:none;padding:14px 20px 20px;border-top:1px solid rgba(43,25,46,0.08);">
    ${bodyHtml}
  </div>
</div>`
    }

    let html = ''

    // HIGH — always visible
    if (high.length) {
      html += gridWrap(findingCards(high), high.length)
    }

    // Expand All button — only when there are collapsed sections
    if (medium.length || low.length) {
      html += `<div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
        <button id="risks-expand-all" style="background:none;border:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6B5A6D;cursor:pointer;padding:0;font-family:inherit;">Expand All</button>
      </div>`
    }

    // MEDIUM — collapsed
    if (medium.length) {
      html += riskAccordion({
        label:       `Show ${medium.length} medium finding${medium.length > 1 ? 's' : ''}`,
        count:       medium.length,
        pillColor:   '#D97706',
        pillBorder:  '#D97706',
        bodyHtml:    gridWrap(findingCards(medium), medium.length),
      })
    }

    // LOW — collapsed
    if (low.length) {
      html += riskAccordion({
        label:       `Show ${low.length} low finding${low.length > 1 ? 's' : ''}`,
        count:       low.length,
        pillColor:   '#9CA3AF',
        pillBorder:  '#9CA3AF',
        bodyHtml:    gridWrap(findingCards(low), low.length),
      })
    }

    return html
  }

  function renderFinancialContent() {
    const fo         = a.financial_outlook || {}
    const mf         = fo.monthly_fees  || {}
    const reserve    = fo.reserve_fund  || {}
    const insurance  = fo.insurance     || null
    const toArr      = v => Array.isArray(v) ? v : (v?.items || [])
    const specAssess = toArr(fo.special_assessments)
    const deferred   = toArr(fo.deferred_maintenance)
    const litigation = toArr(fo.litigation_costs)
    const fmt$       = n => (n != null && n !== '') ? '$' + Number(n).toLocaleString() : null
    const CARD       = 'background:#FFFFFF;border:1px solid rgba(43,25,46,0.08);border-radius:8px;padding:20px 24px;margin-bottom:16px;'
    const LABEL      = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B5A6D;margin:0 0 8px;'

    let html = ''

    // ── SECTION 1: Verified Financial Exposure — full-width dark card ──
    const lineItems = []
    if (reserve.shortfall_amount)
      lineItems.push({ label: 'Reserve fund shortfall', amount: reserve.shortfall_amount })
    specAssess.forEach(s => {
      if (s.estimated_amount_per_unit)
        lineItems.push({ label: `Special assessment: ${s.description}`, amount: s.estimated_amount_per_unit, note: 'per unit' })
    })
    deferred.forEach(d => {
      if (d.estimated_cost)
        lineItems.push({ label: d.item, amount: d.estimated_cost })
    })
    litigation.forEach(l => {
      const amt = l.estimated_total_exposure || l.costs_to_date
      if (amt) lineItems.push({ label: `Legal: ${l.description}`, amount: amt })
    })
    if (lineItems.length) {
      const total = lineItems.reduce((sum, i) => sum + Number(i.amount), 0)
      html += `<div style="background:#2B192E;border-radius:8px;padding:20px 24px;margin-bottom:16px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:rgba(245,232,218,0.6);margin:0 0 12px;">Verified Financial Exposure</p>
        ${lineItems.map(i => `
          <div style="display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.08);">
            <span style="font-size:14px;color:rgba(255,255,255,0.7);">${i.label}${i.note ? ` <span style="font-size:11px;color:rgba(255,255,255,0.35);">(${i.note})</span>` : ''}</span>
            <strong style="font-size:14px;color:#FFFFFF;white-space:nowrap;margin-left:16px;">${fmt$(i.amount)}</strong>
          </div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.2);">
          <span style="font-size:12px;color:rgba(255,255,255,0.45);">Total (verified line items only)</span>
          <strong style="font-size:16px;color:#FFFFFF;">${fmt$(total)}</strong>
        </div>
      </div>`
    }

    // ── SECTION 2: Monthly Fees ───────────────────────────────────────
    if (mf.current_monthly_fee) {
      const feeLines = [`<p style="font-size:14px;font-weight:500;color:#2B192E;margin:0 0 4px;">Current monthly fee: ${fmt$(mf.current_monthly_fee)}</p>`]
      if (mf.upcoming_fee)
        feeLines.push(`<p style="font-size:14px;color:#B45309;margin:0 0 4px;">Upcoming fee: ${fmt$(mf.upcoming_fee)}${mf.upcoming_fee_date ? ` effective ${mf.upcoming_fee_date}` : ''}${mf.upcoming_fee_percent_change ? ` (+${mf.upcoming_fee_percent_change}%)` : ''}</p>`)
      if (mf.transfer_fees_due_at_closing)
        feeLines.push(`<p style="font-size:14px;color:#6B5A6D;margin:0;">Transfer fees at closing: ${fmt$(mf.transfer_fees_due_at_closing)}</p>`)
      html += `<div style="${CARD}">
        <p style="${LABEL}">Monthly Fees</p>
        ${feeLines.join('')}
      </div>`
    }

    // ── SECTION 3: Reserve Fund ───────────────────────────────────────
    if (Object.keys(reserve).length) {
      const pct      = reserve.current_percent_funded
      const barFill  = pct != null ? Math.min(pct, 100) : 0
      const barColor = pct == null ? '#9CA3AF' : pct < 50 ? '#DC2626' : pct < 70 ? '#D97706' : '#15803D'
      const progressBar = pct != null
        ? `<div style="background:#E5E7EB;border-radius:999px;height:8px;margin:8px 0 10px;overflow:hidden;">
            <div style="background:${barColor};width:${barFill}%;height:100%;border-radius:999px;"></div>
           </div>`
        : ''
      const reserveLines = []
      if (!reserve.has_reserve_study)
        reserveLines.push(`<p style="font-size:14px;color:#B91C1C;font-weight:600;margin:0 0 4px;">No reserve study found</p>`)
      if (pct != null)
        reserveLines.push(`<p style="font-size:14px;font-weight:500;color:#2B192E;margin:0 0 2px;">${pct}% funded</p>${progressBar}`)
      if (reserve.shortfall_amount)
        reserveLines.push(`<p style="font-size:14px;color:#B91C1C;margin:0 0 4px;">Shortfall: <strong>${fmt$(reserve.shortfall_amount)}</strong></p>`)
      if (reserve.projected_funding_year)
        reserveLines.push(`<p style="font-size:14px;color:#6B5A6D;margin:0 0 4px;">Projected fully funded: ${reserve.projected_funding_year}</p>`)
      if (reserve.board_action_discussed)
        reserveLines.push(`<p style="font-size:14px;color:#6B5A6D;margin:0;line-height:1.6;">${reserve.board_action_discussed}</p>`)
      html += `<div style="${CARD}">
        <p style="${LABEL}">Reserve Fund</p>
        ${reserveLines.join('')}
      </div>`
    }

    // ── SECTION 4: Special Assessments ───────────────────────────────
    if (specAssess.length) {
      const rows = specAssess.map(s => {
        const saStatus = ['APPROVED','VOTED','LEVIED'].includes(s.status) ? 'ACTIVE' : 'PROPOSED'
        return `<div style="padding:10px 0;border-bottom:1px solid rgba(43,25,46,0.06);">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;">
            <p style="font-size:14px;font-weight:500;color:#2B192E;margin:0;flex:1;">${s.description}</p>
            ${renderBadge(saStatus)}
          </div>
          ${s.estimated_amount_per_unit ? `<p style="font-size:14px;color:#B91C1C;font-weight:500;margin:0 0 3px;">Est. per unit: ${fmt$(s.estimated_amount_per_unit)}</p>` : ''}
          ${s.likely_timeline           ? `<p style="font-size:13px;color:#6B5A6D;margin:0 0 3px;">Timeline: ${s.likely_timeline}</p>` : ''}
          ${s.source_meeting            ? `<span style="font-size:11px;font-family:monospace;color:#A67388;">📅 ${s.source_meeting}</span>` : ''}
        </div>`
      }).join('')
      html += `<div style="${CARD}">
        <p style="${LABEL}">Special Assessments</p>
        ${rows}
      </div>`
    }

    // ── SECTION 5: Deferred Maintenance — show 2, expand toggle ──────
    if (deferred.length) {
      const makeRow = d => `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(43,25,46,0.06);gap:12px;">
          <div style="flex:1;">
            <p style="font-size:14px;font-weight:500;color:#2B192E;margin:0 0 3px;">${d.item}</p>
            ${d.timeline       ? `<p style="font-size:13px;color:#6B5A6D;margin:0 0 3px;">Timeline: ${d.timeline}</p>` : ''}
            ${d.source_meeting ? `<span style="font-size:11px;font-family:monospace;color:#A67388;">📅 ${d.source_meeting}</span>`
              : d.source_document ? `<span style="font-size:11px;font-family:monospace;color:#A67388;">📄 ${d.source_document}</span>` : ''}
          </div>
          ${d.estimated_cost ? `<p style="font-size:14px;color:#B45309;font-weight:500;white-space:nowrap;margin:0;">${fmt$(d.estimated_cost)}</p>` : ''}
        </div>`
      const visible  = deferred.slice(0, 2).map(makeRow).join('')
      const hidden   = deferred.slice(2).map(makeRow).join('')
      const showMore = deferred.length > 2
        ? `<div id="deferred-hidden" style="display:none;">${hidden}</div>
           <button id="deferred-toggle" style="background:none;border:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6B5A6D;cursor:pointer;padding:10px 0 0;font-family:inherit;">Show ${deferred.length - 2} more</button>`
        : ''
      html += `<div style="${CARD}">
        <p style="${LABEL}">Deferred Maintenance</p>
        ${visible}${showMore}
      </div>`
    }

    // ── SECTION 6: Insurance ──────────────────────────────────────────
    if (insurance) {
      const insStatus = insurance.coverage_status === 'CURRENT' ? 'CURRENT' : 'LAPSED'
      const insLines  = []
      if (insurance.policy_expiration_date)
        insLines.push(`<p style="font-size:14px;color:#6B5A6D;margin:0 0 4px;">Policy expires: ${insurance.policy_expiration_date}</p>`)
      ;(insurance.coverage_gaps || []).forEach(g =>
        insLines.push(`<p style="font-size:14px;color:#B91C1C;margin:0 0 3px;">⚠ ${g}</p>`)
      )
      if (insurance.deductible_owner_responsibility)
        insLines.push(`<p style="font-size:14px;color:#6B5A6D;margin:0;">Owner deductible: ${insurance.deductible_owner_responsibility}</p>`)
      html += `<div style="${CARD}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <p style="${LABEL}margin-bottom:0;">Insurance</p>
          ${renderBadge(insStatus)}
        </div>
        ${insLines.join('')}
      </div>`
    }

    // ── SECTION 7: Litigation ─────────────────────────────────────────
    if (litigation.length) {
      const litRows = litigation.map(l => {
        const litStatus = l.resolution_status === 'SETTLED' ? 'SETTLED' : 'ONGOING'
        const src       = l.source_meeting || l.source_document
        return `<div style="padding:10px 0;border-bottom:1px solid rgba(43,25,46,0.06);">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;">
            <p style="font-size:14px;font-weight:500;color:#2B192E;margin:0;flex:1;">${l.description}</p>
            ${renderBadge(litStatus)}
          </div>
          ${l.costs_to_date            ? `<p style="font-size:14px;color:#6B5A6D;margin:0 0 3px;">Costs to date: ${fmt$(l.costs_to_date)}</p>` : ''}
          ${l.estimated_total_exposure ? `<p style="font-size:14px;color:#B91C1C;font-weight:500;margin:0 0 3px;">Total exposure: ${fmt$(l.estimated_total_exposure)}</p>` : ''}
          ${src ? `<span style="font-size:11px;font-family:monospace;color:#A67388;">${l.source_meeting ? '📅' : '📄'} ${src}</span>` : ''}
        </div>`
      }).join('')
      html += `<div style="${CARD}">
        <p style="${LABEL}">Litigation</p>
        ${litRows}
      </div>`
    }

    return html || `<div style="${CARD}">
      <p style="${LABEL}">No financial data available</p>
      <p style="font-size:14px;color:#2B192E;line-height:1.6;margin:0;">No financial information was found in the uploaded documents.</p>
    </div>`
  }

  function renderRestrictionsContent() {
    const found    = a.restrictions?.restrictions_found || []
    const profiles = a.buyer_profile_verdicts?.verdicts || []

    if (!found.length && !profiles.length) {
      return `<div style="background:#FFFFFF;border-radius:8px;border:1px solid rgba(43,25,46,0.08);padding:20px 24px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B5A6D;margin:0 0 8px;">No restrictions data available</p>
        <p style="font-size:14px;font-weight:400;color:#2B192E;line-height:1.6;margin:0;">No restriction information was found in the uploaded documents.</p>
      </div>`
    }

    // Verdict → badge key + label
    function verdictBadge(verdict) {
      if (verdict === 'DO NOT BUY') return { key: 'HIGH',     label: 'Restrictions Apply'    }
      if (verdict === 'CAUTION')    return { key: 'MEDIUM',   label: 'Review Recommended'    }
      return                               { key: 'VERIFIED', label: 'No Issues Found'       }
    }

    // Inline accordion — same DOM structure as riskAccordion so toggle handler fires
    // wrapper: border-radius:8px + 2 children (header cursor:pointer + body display:none)
    function restAccordion({ title, count, pillSeverity, bodyHtml }) {
      const s       = { HIGH: '#DC2626', MEDIUM: '#D97706', LOW: '#9CA3AF' }
      const color   = s[pillSeverity] || '#9CA3AF'
      const pill    = `<span style="color:${color};background:transparent;border:1px solid ${color};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;flex-shrink:0;">${count}</span>`
      const chevron = `<div style="width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid rgba(43,25,46,0.25);flex-shrink:0;"></div>`
      return `<div data-rest-acc="1" style="background:#FFFFFF;border:1px solid rgba(43,25,46,0.08);border-radius:8px;overflow:hidden;margin-bottom:8px;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;">
    <p style="font-size:13px;font-weight:600;color:#2B192E;margin:0;">${title}</p>
    <div style="display:flex;align-items:center;gap:8px;">${pill}${chevron}</div>
  </div>
  <div style="display:none;padding:14px 20px 20px;border-top:1px solid rgba(43,25,46,0.08);">
    ${bodyHtml}
  </div>
</div>`
    }

    let html = ''

    // ── SECTION 1: Buyer Profile Verdicts ────────────────────────────
    if (profiles.length) {
      const cards = profiles.map(v => {
        const { key, label } = verdictBadge(v.verdict)
        const badge = renderBadge(key)
        return `<div style="background:#FFFFFF;border:1px solid rgba(43,25,46,0.08);border-radius:8px;padding:20px 24px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B5A6D;margin:0;">${v.buyer_type_label || 'Buyer Profile'}</p>
            ${badge}
          </div>
          ${v.verdict_reason ? `<p style="font-size:14px;color:#2B192E;line-height:1.6;margin:0;">${v.verdict_reason}</p>` : ''}
        </div>`
      }).join('')
      html += `<div style="margin-bottom:24px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B5A6D;margin:0 0 8px;">Buyer Profile Verdicts</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">${cards}</div>
      </div>`
    }

    // ── SECTION 2: Rules by Category ─────────────────────────────────
    if (found.length) {
      // Group by category
      const byCategory = {}
      found.forEach(res => {
        const cat = res.category_label || res.category_id || 'Other'
        if (!byCategory[cat]) byCategory[cat] = []
        byCategory[cat].push(res)
      })

      // Sort: categories with HIGH items first
      const sortedCats = Object.keys(byCategory).sort((x, y) => {
        const xHigh = byCategory[x].filter(r => r.buyer_impact === 'HIGH' || r.buyer_impact === 'CRITICAL').length
        const yHigh = byCategory[y].filter(r => r.buyer_impact === 'HIGH' || r.buyer_impact === 'CRITICAL').length
        return yHigh - xHigh
      })

      // Expand All header row
      html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6B5A6D;margin:0;">Rules by Category</p>
        <button id="restrict-expand-all" style="background:none;border:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6B5A6D;cursor:pointer;padding:0;font-family:inherit;">Expand All</button>
      </div>`

      sortedCats.forEach(cat => {
        const items = byCategory[cat]
        const hasHigh   = items.some(r => r.buyer_impact === 'HIGH' || r.buyer_impact === 'CRITICAL')
        const hasMedium = items.some(r => r.buyer_impact === 'MEDIUM')
        const pillSev   = hasHigh ? 'HIGH' : hasMedium ? 'MEDIUM' : 'LOW'

        const bodyRows = items.map(res => {
          const src = res.source_document
            ? `<span style="font-size:11px;font-family:monospace;color:#A67388;display:block;margin-top:4px;">${res.source_document}${res.source_section ? ' · ' + res.source_section : ''}</span>`
            : ''
          const dealbreakerNote = res.dealbreaker_for
            ? `<p style="font-size:12px;color:#B91C1C;font-weight:600;margin:4px 0 0;">Dealbreaker for: ${res.dealbreaker_for}</p>`
            : ''
          return `<div style="padding:10px 0;border-bottom:1px solid rgba(43,25,46,0.06);">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
              <p style="font-size:14px;color:#2B192E;line-height:1.6;margin:0;flex:1;">${res.rule}</p>
              ${renderBadge(res.buyer_impact || 'LOW')}
            </div>
            ${dealbreakerNote}${src}
          </div>`
        }).join('')

        html += restAccordion({
          title:        cat,
          count:        `${items.length} rule${items.length > 1 ? 's' : ''}`,
          pillSeverity: pillSev,
          bodyHtml:     bodyRows,
        })
      })
    }

    return html
  }

  function mountTabContent() {
    contentMount.innerHTML = ''
    if (activeTab === 'risks') {
      contentMount.innerHTML = `<div style="padding:24px;">${renderRisksContent()}</div>`
    } else if (activeTab === 'financial') {
      contentMount.innerHTML = `<div style="padding:24px;">${renderFinancialContent()}</div>`
    } else if (activeTab === 'restrictions') {
      contentMount.innerHTML = `<div style="padding:24px;">${renderRestrictionsContent()}</div>`
    }
    // Other tabs deferred — placeholder until each is implemented
  }

  function mountTabs() {
    tabsMount.innerHTML = renderCategoryTabs(activeTab)
  }

  mountTabs()
  mountTabContent()

  tabsMount.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]')
    if (tab && tab.dataset.tab !== activeTab) {
      activeTab = tab.dataset.tab
      mountTabs()
      mountTabContent()
    }
  })

  // Accordion toggle — event delegation on contentMount, survives re-renders.
  // Walks up from the click target to find the accordion wrapper:
  //   wrapper = div with border-radius:8px and exactly 2 children (header + body)
  //   header  = wrapper.children[0]  (the clickable row)
  //   body    = wrapper.children[1]  (the collapsible content)
  // Stops propagation so nested finding cards don't accidentally trigger.
  contentMount.addEventListener('click', e => {
    // Walk up to find an accordion wrapper — identified by border-radius:8px + 2 children
    let el = e.target
    let wrapper = null
    while (el && el !== contentMount) {
      if (
        el.children.length === 2 &&
        el.style.borderRadius === '8px' &&
        el.children[0].style.cursor === 'pointer'
      ) {
        wrapper = el
        break
      }
      el = el.parentElement
    }
    if (!wrapper) return

    const header  = wrapper.children[0]
    const body    = wrapper.children[1]
    const chevron = header.querySelector('div[style*="border-left:5px"]')
    if (!body) return

    const isOpen = body.style.display !== 'none'
    body.style.display = isOpen ? 'none' : 'block'
    if (chevron) chevron.style.transform = isOpen ? '' : 'rotate(90deg)'
  })

  // Expand All / Collapse All — risks tab only.
  // Targets [data-risk-acc] wrappers — injected by riskAccordion() in renderRisksContent.
  contentMount.addEventListener('click', e => {
    const btn = e.target.closest('#risks-expand-all')
    if (!btn) return
    const isExpanding = btn.textContent.trim() === 'Expand All'
    btn.textContent = isExpanding ? 'Collapse All' : 'Expand All'
    contentMount.querySelectorAll('[data-risk-acc]').forEach(wrapper => {
      const body    = wrapper.children[1]
      const chevron = wrapper.children[0].querySelector('div[style*="border-left:5px"]')
      if (!body) return
      body.style.display = isExpanding ? 'block' : 'none'
      if (chevron) chevron.style.transform = isExpanding ? 'rotate(90deg)' : ''
    })
  })

  // Expand All / Collapse All — restrictions tab only.
  // Targets [data-rest-acc] wrappers injected by restAccordion() in renderRestrictionsContent.
  contentMount.addEventListener('click', e => {
    const btn = e.target.closest('#restrict-expand-all')
    if (!btn) return
    const isExpanding = btn.textContent.trim() === 'Expand All'
    btn.textContent = isExpanding ? 'Collapse All' : 'Expand All'
    contentMount.querySelectorAll('[data-rest-acc]').forEach(wrapper => {
      const body    = wrapper.children[1]
      const chevron = wrapper.children[0].querySelector('div[style*="border-left:5px"]')
      if (!body) return
      body.style.display = isExpanding ? 'block' : 'none'
      if (chevron) chevron.style.transform = isExpanding ? 'rotate(90deg)' : ''
    })
  })

  // Deferred Maintenance show more/less — financial tab only.
  contentMount.addEventListener('click', e => {
    const btn = e.target.closest('#deferred-toggle')
    if (!btn) return
    const hidden     = document.getElementById('deferred-hidden')
    const isHidden   = hidden.style.display === 'none'
    const total      = hidden.children.length
    hidden.style.display   = isHidden ? 'block' : 'none'
    btn.textContent        = isHidden ? 'Show less' : `Show ${total} more`
  })

  // ── DEFERRED — old role-toggle views, not yet migrated ───────────────
  // mountAgentView()
  // mountBuyerView()
  // mountRoleToggle()
  // swapViews()

  })() // end async IIFE
</script>

</body>
</html>
